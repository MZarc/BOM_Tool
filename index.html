<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOM Tool</title>
    <style>
      /* ── Splash Screen ──────────────────────────────────────────────────── */

      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #080e1a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        font-family: 'HandilPro', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
        transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                    filter 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                    transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #splash.fade-out {
        opacity: 0;
        filter: blur(12px);
        transform: scale(1.03);
        pointer-events: none;
      }

      /* Ambient blobs consolidated — solid light hint for speed */
      #splash-blob-1 {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 800px;
        height: 800px;
        border-radius: 50%;
        background: rgba(59, 130, 246, 0.02);
        pointer-events: none;
      }

      /* Grid overlay */
      #splash-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(59,130,246,0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(59,130,246,0.025) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none;
      }

      /* Core content wrapper */
      #splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        animation: splash-enter 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      @keyframes splash-enter {
        from { opacity: 0; transform: translateY(20px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* Logo tile */
      #splash-icon-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #splash-icon-glow {
        display: none;
      }
      #splash-icon-box {
        position: relative;
        width: 112px;
        height: 112px;
        border-radius: 28px;
        background: #080e1a;
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow:
          0 24px 80px rgba(0, 0, 0, 0.7),
          inset 0 1px 0 rgba(255, 255, 255, 0.07);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #splash-icon-box img {
        width: 64px;
        height: 64px;
        object-fit: contain;
        filter: brightness(1.2) drop-shadow(0 0 20px rgba(59, 130, 246, 0.4));
      }

      /* Brand text */
      #splash-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      #splash-title {
        font-size: 52px;
        font-weight: 900;
        letter-spacing: -0.04em;
        background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0.35) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        user-select: none;
        line-height: 1;
      }
      #splash-sub {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.2);
        letter-spacing: 0.35em;
        text-transform: uppercase;
        font-weight: 900;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #splash-sub::before, #splash-sub::after {
        content: '';
        display: block;
        width: 20px;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
      }

      /* Progress section */
      #splash-progress-wrap {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 280px;
      }
      #splash-status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #splash-status-label {
        font-size: 10px;
        font-weight: 900;
        color: rgba(255, 255, 255, 0.25);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        transition: opacity 0.3s ease;
      }
      #splash-pct {
        font-size: 10px;
        font-weight: 900;
        color: rgba(59, 130, 246, 0.7);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.05em;
      }

      /* Progress bar track */
      #splash-bar-track {
        position: relative;
        height: 3px;
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 999px;
        overflow: visible;
      }
      #splash-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #3b82f6, #60a5fa, #93c5fd);
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
        width: 0%;
        transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #splash-bar-dot {
        position: absolute;
        top: 50%;
        transform: translateY(-50%) translateX(-50%);
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: white;
        box-shadow: 0 0 14px rgba(255, 255, 255, 0.9);
        left: 0%;
        transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Developer credit */
      #splash-credit {
        font-size: 10px;
        font-weight: 900;
        color: rgba(255, 255, 255, 0.13);
        text-transform: uppercase;
        letter-spacing: 0.3em;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 4px;
      }
      #splash-credit::before, #splash-credit::after {
        content: '';
        display: block;
        width: 24px;
        height: 1px;
        background: rgba(255, 255, 255, 0.08);
      }
      #splash-credit span {
        color: rgba(255, 255, 255, 0.3);
      }

      /* Hide root until ready */
      #root:not(.ready) { visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading BOM Tool">
      <div id="splash-grid"></div>
      <div id="splash-blob-1"></div>
      <div id="splash-blob-2"></div>

      <div id="splash-content">
        <!-- Logo -->
        <div id="splash-icon-wrap">
          <div id="splash-icon-glow"></div>
          <div id="splash-icon-box">
            <img src="/icon.png" alt="BOM Tool Logo" />
          </div>
        </div>

        <!-- Brand -->
        <div id="splash-brand">
          <div id="splash-title">BOM Tool</div>
          <div id="splash-sub">Production-Ready BOM Accuracy</div>
        </div>

        <!-- Progress -->
        <div id="splash-progress-wrap">
          <div id="splash-status-row">
            <span id="splash-status-label">Initializing core engine...</span>
            <span id="splash-pct">0%</span>
          </div>
          <div id="splash-bar-track">
            <div id="splash-bar-fill"></div>
            <div id="splash-bar-dot"></div>
          </div>
        </div>

        <!-- Developer credit -->
        <div id="splash-credit">Developed by <span>Meet Mistry</span></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // ── Splash Progress Animation ──────────────────────────────────────────
      const steps = [
        { label: 'Initializing core engine...', progress: 15 },
        { label: 'Loading BOM processor...', progress: 38 },
        { label: 'Mounting component registry...', progress: 62 },
        { label: 'Applying design system...', progress: 82 },
        { label: 'Ready to launch ✦', progress: 100 },
      ];
      const delays = [300, 580, 820, 650, 480];

      const fill = document.getElementById('splash-bar-fill');
      const dot  = document.getElementById('splash-bar-dot');
      const lbl  = document.getElementById('splash-status-label');
      const pct  = document.getElementById('splash-pct');

      function setProgress(p) {
        const clamped = Math.min(p, 99.5);
        if (fill) fill.style.width = p + '%';
        if (dot)  dot.style.left  = clamped + '%';
        if (pct)  pct.textContent = Math.round(p) + '%';
      }

      let stepIdx = 0;
      function advanceStep() {
        if (stepIdx >= steps.length) return;
        const step = steps[stepIdx];
        setProgress(step.progress);
        if (lbl) lbl.textContent = step.label;
        stepIdx++;
        if (stepIdx < steps.length) {
          setTimeout(advanceStep, delays[stepIdx - 1]);
        }
      }
      setTimeout(advanceStep, 100);

      // ── Dismiss when React signals ready ──────────────────────────────────
      const rootEl   = document.getElementById('root');
      const splashEl = document.getElementById('splash');
      const observer = new MutationObserver(() => {
        if (rootEl && rootEl.classList.contains('ready') && splashEl) {
          // Ensure bar hits 100% before fading
          setProgress(100);
          if (pct) pct.textContent = '100%';
          setTimeout(() => {
            splashEl.classList.add('fade-out');
            setTimeout(() => splashEl.remove(), 850);
          }, 250);
          observer.disconnect();
        }
      });
      if (rootEl) observer.observe(rootEl, { attributes: true, attributeFilter: ['class'] });
    </script>
  </body>
</html>
